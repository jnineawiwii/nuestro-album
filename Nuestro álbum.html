<!doctype html>
<html>
  <head>
    <meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Nuestro álbum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..700;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600&family=Reenie+Beanie&display=swap">
    <!-- Cargar la librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    :root {
      --bg: #ece1e4; --paper: #fbf6f5; --frame: #ffffff; --ink: #2b1824;
      --muted: #7a6270; --accent: #a8264c; --line: #d9c6cc; --shadow: rgba(43, 24, 36, 0.22);
      --f-display: "Bodoni Moda", "Didot", "Times New Roman", serif;
      --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      --f-hand: "Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #170e15; --paper: #261820; --frame: #efe2e6; --ink: #f3e2e7; --muted: #b49aa6;
        --accent: #ee7b97; --line: #3f2c36; --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 40px; }
    .wrap { max-width: 920px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .bar .tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; color: var(--ink); transition: border-color .15s, color .15s, background .15s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    .btn.solid:hover { color: var(--paper); filter: brightness(1.08); }
    .btn[hidden] { display: none; }
    .folio-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .status { min-height: 1.4em; font-size: 13px; color: var(--muted); }
    .book { position: relative; background: var(--paper); border-radius: 6px 16px 16px 6px; border-left: 12px solid color-mix(in srgb, var(--accent) 78%, #000); box-shadow: 0 1px 0 var(--line), 0 30px 40px -28px var(--shadow); padding: clamp(20px, 5vw, 52px) clamp(18px, 5vw, 56px); min-height: 540px; display: flex; flex-direction: column; transform-origin: left center; }
    .book::before { content: ""; position: absolute; left: 10px; top: 14px; bottom: 14px; border-left: 1px dashed var(--line); pointer-events: none; }
    .field { background: transparent; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; width: 100%; padding: 4px 0; color: var(--ink); }
    .field::placeholder { color: var(--muted); opacity: .8; }
    .field:focus { outline: none; border-bottom-color: var(--accent); }
    .cover { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding-block: 8px; }
    .eyebrow { margin: 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .title { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.1; text-align: center; border-bottom-color: transparent; }
    .names { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px 14px; width: 100%; }
    .names .field { width: min(46%, 14ch); min-width: 9ch; text-align: center; font-family: var(--f-display); font-size: 1.35rem; }
    .amp { font-family: var(--f-display); font-style: italic; font-size: 1.6rem; color: var(--accent); }
    .since { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .since .field { width: auto; color-scheme: inherit; }
    .counter { display: flex; flex-direction: column; align-items: center; gap: 0; margin-block: 4px; }
    .counter .num { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: clamp(4.2rem, 17vw, 8.5rem); line-height: .95; }
    .counter .lbl { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }
    .counter .sub { font-family: var(--f-hand); font-size: 1.7rem; color: var(--muted); line-height: 1.1; margin-top: 4px; }
    .tally { margin: 0; font-size: 13px; color: var(--muted); }
    .spread { flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 56px); align-items: center; }
    @media (max-width: 700px) { .spread { grid-template-columns: minmax(0, 1fr); } }
    .polaroid { position: relative; background: var(--frame); padding: 12px 12px 40px; box-shadow: 0 2px 3px var(--shadow), 0 18px 28px -14px var(--shadow); transform: rotate(-1.6deg); max-width: 100%; justify-self: center; width: min(100%, 400px); }
    .polaroid::before, .polaroid::after { content: ""; position: absolute; width: 74px; height: 22px; top: -9px; background: color-mix(in srgb, var(--accent) 38%, transparent); }
    .polaroid::before { left: -20px; transform: rotate(-35deg); }
    .polaroid::after { right: -20px; transform: rotate(35deg); }
    .photo { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--line); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #e0d0d8; color: #3a1a28; }
    .ph svg { width: 54px; height: 54px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .7; }
    .ph .btn { background: var(--paper); color: var(--ink); border-color: transparent; }
    .ph .hint { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; opacity: .75; }
    .swap { position: absolute; right: 8px; bottom: 8px; }
    .swap .btn { background: color-mix(in srgb, var(--paper) 90%, transparent); font-size: 12px; padding: 5px 11px; }
    .words { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .words .date { width: auto; align-self: flex-start; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
    .words .cap { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(1.6rem, 4.4vw, 2.3rem); line-height: 1.15; }
    .words .note { font-family: var(--f-hand); font-size: 1.85rem; line-height: 1.12; resize: vertical; min-height: 7.5em; border: 0; background-image: repeating-linear-gradient(transparent 0 calc(1.12em - 1px), var(--line) calc(1.12em - 1px) 1.12em); }
    .fav { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; background: transparent; border: 0; padding: 4px 0; color: var(--muted); font-size: 13px; font-weight: 500; }
    .fav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; transition: transform .2s; }
    .fav[aria-pressed="true"] { color: var(--accent); }
    .fav[aria-pressed="true"] svg { fill: currentColor; transform: scale(1.1); }
    .folio { margin-top: auto; padding-top: 22px; align-self: flex-end; font-family: var(--f-display); font-style: italic; color: var(--muted); font-size: 14px; }
    .letter { flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .letter h2 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .letter .body { flex: 1; min-height: 16em; resize: vertical; border: 0; font-family: var(--f-hand); font-size: clamp(1.9rem, 4.6vw, 2.4rem); line-height: 1.12; background-color: transparent; background-image: repeating-linear-gradient(transparent 0 calc(1.12em - 1px), var(--line) calc(1.12em - 1px) 1.12em); }
    .nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
    .progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
    .nav .btn:disabled { opacity: .4; cursor: default; border-color: var(--line); color: var(--muted); }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar">
        <span class="folio-label" id="where">Cargando...</span>
        <div class="tools">
          <button class="btn solid" id="addBtn" type="button">Agregar fotos</button>
          <button class="btn" id="blankBtn" type="button">Página en blanco</button>
          <button class="btn" id="sortBtn" type="button">Ordenar por fecha</button>
          <button class="btn" id="delBtn" type="button" hidden>Quitar esta página</button>
        </div>
      </div>
      <div class="status" id="status" role="status">Cargando álbum desde Supabase...</div>

      <main class="book" id="stage"></main>

      <nav class="nav" aria-label="Pasar páginas">
        <button class="btn" id="prev" type="button">← Anterior</button>
        <div class="progress" aria-hidden="true"><i id="bar"></i></div>
        <button class="btn" id="next" type="button">Siguiente →</button>
      </nav>
    </div>

    <input class="vh" type="file" id="addMany" accept="image/*" multiple tabindex="-1">
    <input class="vh" type="file" id="fillOne" accept="image/*" tabindex="-1">

    <script>
    (function () {
      var SUPABASE_URL = "https://ztxyyxsurkgrwffuuazb.supabase.co";
      var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0eHl5eHN1cmtncndmZnV1YXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDMwNTgsImV4cCI6MjEwNjg3OTA1OH0.NK3F27pFsjbYNGzFManEI8aWJDCh5Xcl0_kY4YJj7bQ";

      var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var $ = function (s) { return document.querySelector(s); };
      var esc = function (s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      };
      var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
      var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.7 3 5.5 6.2 5.5c2 0 3.3 1.1 3.8 2 .5-.9 1.8-2 3.8-2 3.2 0 5 3.2 3.7 6.3C19.5 16.4 12 21 12 21z"/></svg>';

      var S = { title: "Nuestro álbum", n1: "", n2: "", since: "", letter: "", pages: [] };
      var i = 0;

      function setStatus(t) { $("#status").textContent = t || ""; }

      // Cargar datos iniciales desde Supabase con manejo seguro de errores
      async function init() {
        try {
          var { data, error } = await sb.from('album').select('*').eq('id', 'main').maybeSingle();
          if (error) throw error;
          
          if (data) {
            S = data;
          } else {
            // Si no existe la fila 'main', la crea automáticamente
            await sb.from('album').upsert({
              id: 'main',
              title: S.title,
              n1: S.n1,
              n2: S.n2,
              since: S.since,
              letter: S.letter,
              pages: S.pages
            });
          }
          setStatus("");
          render();
        } catch (e) {
          console.error("Error al iniciar Supabase:", e);
          setStatus("Error al conectar con Supabase. " + (e.message || "Revisa permisos RLS."));
        }
      }

      var saveT = null;
      function save() {
        clearTimeout(saveT);
        saveT = setTimeout(async function () {
          setStatus("Guardando en la nube...");
          var { error } = await sb.from('album').upsert({
            id: 'main',
            title: S.title || "Nuestro álbum",
            n1: S.n1 || "",
            n2: S.n2 || "",
            since: S.since || "",
            letter: S.letter || "",
            pages: S.pages || [],
            updated_at: new Date().toISOString()
          });
          if (error) {
            console.error("Error al guardar:", error);
            setStatus("Error al guardar cambios: " + error.message);
          } else {
            setStatus("Guardado en Supabase.");
          }
        }, 500);
      }

      // Subir archivo de imagen al Bucket de Supabase
      async function uploadPhoto(file) {
  var fileExt = file.name.split('.').pop();
  var fileName = uid() + '.' + fileExt;
  
  // Guardar directamente en la raíz del bucket en lugar de 'public/' + fileName
  var filePath = fileName;

  var { error: uploadError } = await sb.storage.from('PHOTOS').upload(filePath, file);
  if (uploadError) throw uploadError;

  var { data } = sb.storage.from('PHOTOS').getPublicUrl(filePath);
  return data.publicUrl;
}

      function elapsed(s) {
        if (!s) return null;
        var p = s.split("-").map(Number);
        if (p.length < 3 || !p[0]) return null;
        var a = new Date(p[0], p[1] - 1, p[2]), t = new Date();
        var b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        var days = Math.round((b - a) / 864e5);
        if (days < 0) return { days: -days, neg: true };
        var months = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
        if (b.getDate() < a.getDate()) months--;
        return { days: days, months: Math.max(0, months) };
      }

      function counterHTML() {
        var e = elapsed(S.since);
        if (!e) return '<span class="num" aria-hidden="true">♥</span><span class="lbl">Elige la fecha en que empezó todo</span>';
        if (e.neg) return '<span class="num">' + e.days + '</span><span class="lbl">' + (e.days === 1 ? "día para el gran día" : "días para el gran día") + "</span>";
        var y = Math.floor(e.months / 12), m = e.months % 12, parts = [];
        if (y) parts.push(y + (y === 1 ? " año" : " años"));
        if (m) parts.push(m + (m === 1 ? " mes" : " meses"));
        var sub = parts.length ? '<span class="sub">' + parts.join(" y ") + "</span>" : "";
        return '<span class="num">' + e.days + '</span><span class="lbl">' + (e.days === 1 ? "día juntos" : "días juntos") + "</span>" + sub;
      }

      function tallyText() {
        var n = (S.pages || []).length, f = (S.pages || []).filter(function (p) { return p.fav; }).length;
        return n + (n === 1 ? " recuerdo guardado" : " recuerdos guardados") + " · " + f + (f === 1 ? " favorito" : " favoritos");
      }

      function coverHTML() {
        return '<div class="cover">' +
          '<p class="eyebrow">Álbum de pimpollos</p>' +
          '<input class="field title" id="title" value="' + esc(S.title) + '" placeholder="Nuestro álbum">' +
          '<div class="names">' +
            '<input class="field" id="n1" placeholder="Tu nombre" value="' + esc(S.n1) + '">' +
            '<span class="amp">&amp;</span>' +
            '<input class="field" id="n2" placeholder="Su nombre" value="' + esc(S.n2) + '">' +
          '</div>' +
          '<div class="since"><label for="since">Desde el</label><input class="field" type="date" id="since" value="' + esc(S.since) + '"></div>' +
          '<div class="counter" id="counter">' + counterHTML() + '</div>' +
          '<p class="tally" id="tally">' + tallyText() + '</p>' +
          '<button class="btn solid" id="start" type="button">Abrir el álbum</button>' +
        '</div>';
      }

      function photoHTML(p, idx) {
        var photo = p.img
          ? '<img src="' + p.img + '" alt="Foto"><div class="swap"><button class="btn" id="swapBtn" type="button">Cambiar foto</button></div>'
          : '<div class="ph"><svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="26" rx="3"/><circle cx="24" cy="25" r="7"/><path d="M17 12l2-4h10l2 4"/></svg><span class="hint">Aquí va tu foto</span><button class="btn" id="fillBtn" type="button">Agregar foto</button></div>';
        return '<div class="spread">' +
          '<div class="polaroid"><div class="photo">' + photo + '</div></div>' +
          '<div class="words">' +
            '<input class="field date" type="date" id="dt" value="' + esc(p.date) + '">' +
            '<input class="field cap" id="cap" placeholder="Ponle nombre a este momento" value="' + esc(p.caption) + '">' +
            '<textarea class="field note" id="note" rows="5" placeholder="Escribe lo que no quieres olvidar…">' + esc(p.note) + '</textarea>' +
            '<button class="fav" id="fav" type="button" aria-pressed="' + (p.fav ? "true" : "false") + '">' + HEART + '<span>Momento favorito</span></button>' +
          '</div>' +
        '</div><span class="folio">' + idx + '</span>';
      }

      function letterHTML() {
        return '<div class="letter">' +
          '<p class="eyebrow">Última página</p>' +
          '<h2>Una carta para ti</h2>' +
          '<textarea class="field body" id="letter" placeholder="Escribe aquí lo que quieres decirle…">' + esc(S.letter) + '</textarea>' +
          '<div class="actions"><button class="btn" id="toCover" type="button">Volver a la portada</button></div>' +
        '</div><span class="folio">' + ((S.pages || []).length + 1) + '</span>';
      }

      function render() {
        var stage = $("#stage"), n = (S.pages || []).length;
        if (i < 0) i = 0;
        if (i > n + 1) i = n + 1;
        stage.className = "book";
        stage.innerHTML = i === 0 ? coverHTML() : (i <= n ? photoHTML(S.pages[i - 1], i) : letterHTML());
        bind();
        chrome();
      }

      function chrome() {
        var n = (S.pages || []).length, last = n + 1;
        $("#where").textContent = i === 0 ? "Portada" : (i > n ? "Carta final" : "Página " + i + " de " + n);
        $("#prev").disabled = i === 0;
        $("#next").disabled = i === last;
        $("#bar").style.width = (last ? (i / last) * 100 : 0) + "%";
        $("#delBtn").hidden = !(i >= 1 && i <= n);
      }

      function go(to) { i = to; render(); window.scrollTo({ top: 0, behavior: "auto" }); }

      function bind() {
        var n = (S.pages || []).length;
        if (i === 0) {
          $("#title").addEventListener("input", function (e) { S.title = e.target.value; save(); });
          $("#n1").addEventListener("input", function (e) { S.n1 = e.target.value; save(); });
          $("#n2").addEventListener("input", function (e) { S.n2 = e.target.value; save(); });
          $("#since").addEventListener("input", function (e) { S.since = e.target.value; $("#counter").innerHTML = counterHTML(); save(); });
          $("#start").addEventListener("click", function () { go(1); });
        } else if (i <= n) {
          var p = S.pages[i - 1];
          $("#dt").addEventListener("input", function (e) { p.date = e.target.value; save(); });
          $("#cap").addEventListener("input", function (e) { p.caption = e.target.value; save(); });
          $("#note").addEventListener("input", function (e) { p.note = e.target.value; save(); });
          $("#fav").addEventListener("click", function (e) { p.fav = !p.fav; e.currentTarget.setAttribute("aria-pressed", p.fav ? "true" : "false"); save(); });
          var f = $("#fillBtn") || $("#swapBtn");
          if (f) f.addEventListener("click", function () { $("#fillOne").click(); });
        } else {
          $("#letter").addEventListener("input", function (e) { S.letter = e.target.value; save(); });
          $("#toCover").addEventListener("click", function () { go(0); });
        }
      }

      $("#addBtn").addEventListener("click", function () { $("#addMany").click(); });
      $("#addMany").addEventListener("change", async function (e) {
        var files = Array.prototype.slice.call(e.target.files || []);
        e.target.value = "";
        if (!files.length) return;
        setStatus("Subiendo imágenes a la nube...");
        
        for (var f of files) {
          try {
            var url = await uploadPhoto(f);
            if (!S.pages) S.pages = [];
            S.pages.push({ id: uid(), img: url, date: new Date(f.lastModified).toISOString().split('T')[0], caption: "", note: "", fav: false });
          } catch(err) {
            console.error("Error al subir foto:", err);
            setStatus("Error al subir una imagen.");
          }
        }
        save();
        i = S.pages.length;
        render();
      });

      $("#fillOne").addEventListener("change", async function (e) {
        var f = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!f || i < 1 || i > (S.pages || []).length) return;
        setStatus("Subiendo foto...");
        try {
          var url = await uploadPhoto(f);
          S.pages[i - 1].img = url;
          if (!S.pages[i - 1].date) S.pages[i - 1].date = new Date(f.lastModified).toISOString().split('T')[0];
          save();
          render();
        } catch(err) {
          console.error("Error al actualizar foto:", err);
          setStatus("Error al actualizar la foto.");
        }
      });

      $("#blankBtn").addEventListener("click", function () {
        if (!S.pages) S.pages = [];
        S.pages.push({ id: uid(), img: null, date: "", caption: "", note: "", fav: false });
        save(); i = S.pages.length; render();
      });

      $("#delBtn").addEventListener("click", function () {
        if (!S.pages) return;
        S.pages.splice(i - 1, 1);
        save();
        if (i > S.pages.length) i = S.pages.length;
        render();
      });

      $("#prev").addEventListener("click", function () { if (i > 0) go(i - 1); });
      $("#next").addEventListener("click", function () { if (i < (S.pages || []).length + 1) go(i + 1); });

      init();
    })();
    </script>
  </body>
</html>
